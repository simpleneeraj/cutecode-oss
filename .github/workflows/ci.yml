name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - run: yarn install --frozen-lockfile --non-interactive

      - name: Typecheck
        run: yarn turbo run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: yarn turbo run lint

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: yarn turbo run test:unit

  infra:
    name: Infra typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: infra/yarn.lock

      - run: yarn install --frozen-lockfile --non-interactive

      - run: yarn typecheck
